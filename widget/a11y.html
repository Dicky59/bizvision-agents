<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Accessibility test page for the BizVision chat widget" />
    <title>Widget accessibility test page</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
        background: #fff;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      a {
        color: #0b4f6c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Widget accessibility test page</h1>
      <p>
        A clean host page, so the Lighthouse score measures the widget and not the page. Run
        <code>npm run a11y:lighthouse</code> with the API on port 8000.
      </p>
    </main>
    <script
      type="module"
      src="/src/main.ts"
      data-tenant="bizvision"
      data-api="http://localhost:8000"
      data-open="true"
    ></script>
  </body>
</html>
