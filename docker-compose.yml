services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bv
      POSTGRES_PASSWORD: bv
      POSTGRES_DB: bv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bv -d bv"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
