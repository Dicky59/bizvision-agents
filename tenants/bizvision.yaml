slug: bizvision
name: BizVision Oy
allowed_origins:
  - https://bizvision.fi
  - https://www.bizvision.fi
  - http://localhost:3000
languages: [fi, en]
default_language: fi

assistant:
  model: claude-haiku-5-5
  max_output_tokens: 600
  temperature: 0.2
  tone: "Asiantunteva, ystävällinen ja ytimekäs. Sinuttelu."
  company_description: >
    BizVision Oy on helsinkiläinen tekoälyautomaatioon ja ohjelmistokehitykseen
    erikoistunut yritys, joka palvelee suomalaisia pk-yrityksiä.
  greeting:
    fi: "Hei! Kysy minulta BizVisionin palveluista tai tekoälyautomaatiosta."
    en: "Hi! Ask me about BizVision's services or AI automation."
  starter_questions:
    fi: ["Mitä palveluita tarjoatte?", "Mitä ilmainen auditointi sisältää?", "Miten projekti etenee?"]
    en: ["What services do you offer?", "What does the free audit include?", "How does a project work?"]
  retrieval:
    top_k: 6
    # PROVISIONAL (0.35 before): picked from 6 live data points on bizvision.fi, between the
    # out-of-scope near-miss (0.344) and the weakest answerable query (0.403). Recalibrate on
    # the M4 evals; see docs/decisions.md ADR-004.
    min_relevance: 0.37
  history_turns: 8

ingest:
  start_urls: ["https://www.bizvision.fi"]
  use_sitemap: true
  max_pages: 200
  include_patterns: []
  exclude_patterns: ["/api/", "?"]

handoff:
  email: info@bizvision.fi
  privacy_notice_url:
    fi: https://bizvision.fi/tietosuoja
    en: https://bizvision.fi/en/privacy
  privacy_notice_version: "2026-11"

limits:
  monthly_budget_eur: 30
  messages_per_conversation: 40
  max_message_chars: 1500

retention_days: 90

branding:
  primary_color: "#1f6f8b"
  position: bottom-right
  launcher_label: { fi: "Kysy meiltä", en: "Ask us" }
