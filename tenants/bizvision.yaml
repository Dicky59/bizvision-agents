slug: bizvision
name: BizVision Oy
allowed_origins:
  - https://bizvision.fi
  - https://www.bizvision.fi
  - http://localhost:3000
  - http://localhost:5173   # widget dev test page (Vite); remove before go-live (spec M7)
languages: [fi, en]
default_language: fi

assistant:
  model: claude-haiku-5-5
  max_output_tokens: 600
  temperature: 0.2
  tone: "Asiantunteva, ystävällinen ja ytimekäs. Sinuttelu."
  company_description: >
    BizVision Oy on helsinkiläinen tekoälyautomaatioon ja ohjelmistokehitykseen
    erikoistunut yritys, joka palvelee suomalaisia pk-yrityksiä.
  greeting:
    fi: "Hei! Kysy minulta BizVisionin palveluista tai tekoälyautomaatiosta."
    en: "Hi! Ask me about BizVision's services or AI automation."
  starter_questions:
    fi: ["Mitä palveluita tarjoatte?", "Mitä ilmainen auditointi sisältää?", "Miten projekti etenee?"]
    en: ["What services do you offer?", "What does the free audit include?", "How does a project work?"]
  retrieval:
    top_k: 6
    # Calibrated on the M4 evals (bv evals run; ADR-005): the weakest correctly answered case
    # scored 0.346, so the rule "weakest answered - 0.03" gives 0.31. At 0.37 correct answers
    # were lost as false don't-knows. Questions that should not be answered score up to ~0.59, so
    # this gate cannot separate them: the model's own `answerable` flag does that.
    min_relevance: 0.31
  history_turns: 8

ingest:
  start_urls: ["https://www.bizvision.fi"]
  use_sitemap: true
  max_pages: 200
  include_patterns: []
  exclude_patterns: ["/api/", "?"]

handoff:
  email: info@bizvision.fi
  privacy_notice_url:
    fi: https://www.bizvision.fi/tietosuoja
    en: https://www.bizvision.fi/en/privacy
  privacy_notice_version: "2026-11"
  include_transcript: true
  lead_retention_days: 365

limits:
  monthly_budget_eur: 30
  messages_per_conversation: 40
  max_message_chars: 1500

retention_days: 90

branding:
  display_name: BizVision
  primary_color: "#1D7A82"
  position: bottom-right
  launcher_label: { fi: "Kysy meiltä", en: "Ask us" }
