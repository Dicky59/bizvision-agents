[project]
name = "bizvision-agents"
version = "0.1.0"
description = "BizVision agent platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pgvector",
    "typer",
    "anthropic>=2.10.0",
    "openai>=3.55.1",
    "pyyaml>=6.0.3",
    "email-validator>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "httpx",
    "ruff",
    "pyright",
    "types-pyyaml>=6.0.12.20261113",
]

[project.scripts]
bv = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "agents", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["api", "core", "agents", "cli", "tests", "alembic"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: hits real external APIs (skipped by default)"]
addopts = "-m 'not live'"
